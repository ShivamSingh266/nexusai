version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexusai
      POSTGRES_PASSWORD: nexusai
      POSTGRES_DB: nexusai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql://nexusai:nexusai@postgres:5432/nexusai
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ../backend:/app

  frontend:
    build: ../frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app

volumes:
  pgdata:
